# @package _global_
# APPO owner for the same LEAP ball-rotation task contract used by PPO.
training:
  task_name: LeapInhandBallRotation
  sim_backend: mujoco
  render_spacing: 0.5
  cam_distance: 1.2
  cam_lookat: [0.0, 0.0, 0.5]
  cam_elevation: -20.0

algo:
  num_envs: 16384
  steps_per_env: 8
  max_iterations: 201
  obs_groups:
    actor:
      policy: 0
    critic:
      policy: 0
  actor:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
  algorithm:
    value_loss_coef: 4.0
    desired_kl: 0.02

reward:
  scales:
    rotate: 1.25
    obj_linvel: -0.3
    pose_diff: -0.3
    torque: -0.1
    work: -2.0
    drop: 0.0
  angvel_clip_min: -0.5
  angvel_clip_max: 0.5
  reset_z_threshold: 0.4

env:
  sim_dt: 0.008333333333333333
  ctrl_dt: 0.05
  gen_grasp: false
  max_episode_seconds: 20.0
  reset_source: home
  grasp_cache_path: robots/leap_hand/caches/ball_grasp_s10_5k.npy
  noise_config:
    level: 1.0
    scale_joint_angle: 0.02
  control_config:
    action_scale: 0.041666666666666664
  domain_rand:
    randomize_base_mass: false
    random_com: false
    randomize_gravity: false
    push_robots: false
    joint_noise: 0.0
    ball_vel_noise: 0.0
    ball_z_offset: 0.0

play_profile:
  enabled: true
  env:
    render_spacing: 2.0

interactive:
  show_object_rotation: true
  rotation_body_name: leap_object
