# @package _global_
# LEAP embodiment owner for the Sharpa-parity ball-rotation task. The HORA
# overlay selects the HORA APPO runtime without redefining task semantics.

training:
  task_name: LeapInhandBall0730HoraAppoRotation
  sim_backend: mujoco
  play_steps: 200
  render_spacing: 0.5
  cam_distance: 1.2
  cam_lookat: [0.0, 0.0, 0.665]
  cam_elevation: -20.0
  replay_queue_size: 1
  device: cpu
  collector_device: cpu
  no_play: true

algo:
  num_envs: 2048
  steps_per_env: 32
  max_iterations: 5000
  save_interval: 25
  obs_groups:
    actor:
      policy: 0
    critic:
      policy: 0
  actor:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
  algorithm:
    value_loss_coef: 4.0
    entropy_coef: 0.01
    learning_rate: 0.001
    desired_kl: 0.02
    adaptive_kl_factor: 1.2
    adaptive_lr_factor: 1.1
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0
    use_clipped_value_loss: true
    schedule: adaptive

reward:
  scales:
    rotate: 2.5
    obj_linvel: -0.3
    pose_diff: -0.4
    torque: -0.1
    work: -0.5
    object_pos: 0.003
  angvel_clip_min: -0.5
  angvel_clip_max: 0.5

env:
  object_visual_mesh_name: leap_ball_visual_mesh
  sim_dt: 0.005
  ctrl_dt: 0.05
  max_episode_seconds: 20.0
  post_step_forward_sensor: true
  clip_obs: 5.0
  clip_actions: 1.0
  # Only the 0.06 m width is used; each reset centers it on that cache row's ball z.
  reset_height_lower: 0.58906
  reset_height_upper: 0.64906
  rot_axis: [0.0, 0.0, 1.0]
  grasp_cache_path: robots/leap_hand/caches/ball_grasp_hora_sharpa_style_50k
  use_default_object_pose_for_object_pos_anchor: true
  default_hand_joint_pos:
    - 1.5152045040427635
    - 0.11430147259750476
    - 0.2876406730815961
    - 0.19280835997306603
    - 1.4188457206477074
    - 0.025681830807677088
    - -0.26717932336688344
    - 0.5369823550831088
    - 1.5294890485315962
    - -0.01798386011739139
    - 0.27558019211759954
    - 0.19821762108233876
    - 1.9245445859343515
    - 0.04788276935232176
    - -0.021885380331691334
    - 0.19524630120127295
  default_object_pose:
    - -0.032440416893199604
    - 0.041151239943936
    - 0.664301098275159
    - 0.9300906819767993
    - 0.07052047191574277
    - -0.04548098804911446
    - 0.3576166467976395
  tactile_diagnostic_names: [index, middle, ring, thumb]
  sensor:
    tactile_force_sensor_names:
      - leap_index_tactile_force
      - leap_middle_tactile_force
      - leap_ring_tactile_force
      - leap_thumb_tactile_force
  disable_tactile_ids: []
  obs:
    observation_mode: separated
    enable_tactile: true
    binary_contact: false
    enable_contact_pos: false
    contact_smooth: 0.5
    contact_threshold: 0.05
    tactile_force_clip_max: 4.0
  priv_info:
    include_friction_scale: true
    include_gravity_direction: false
  control_config:
    action_scale: 0.041666666666666664
    # Match the model-owned LEAP 0730 MuJoCo actuator gains.
    p_gain: 3.0
    d_gain: 0.01
    torque_control: false
    # Official LEAP clamps policy targets to the full URDF joint range.
    dof_limits_scale: 1.0
  domain_rand:
    scale_list: [0.8, 1.0, 1.2]
    # Match the HORA reset-domain randomization: fixed magnitude with at most
    # three degrees of tilt away from nominal downward gravity.
    randomize_gravity_direction: true
    gravity_direction_magnitude: 9.81
    gravity_direction_tilt_max_deg: 3.0
    randomize_pd_gains: true
    # Official absolute P range is 2.9..3.1. Preserve the same relative
    # perturbation around UniLab's LEAP 0730 model-owned nominal gains.
    randomize_p_gain_scale_lower: 0.9666666666666667
    randomize_p_gain_scale_upper: 1.0333333333333334
    randomize_d_gain_scale_lower: 0.9
    randomize_d_gain_scale_upper: 1.1
    randomize_friction: true
    # Preserve every LEAP 0730 XML geom's full sliding/torsional/rolling
    # friction vector and apply domain randomization as a multiplier.
    randomize_friction_scale_lower: 0.3
    randomize_friction_scale_upper: 3.0
    scale_xml_friction_per_geom: true
    randomize_com: true
    randomize_com_lower: -0.01
    randomize_com_upper: 0.01
    randomize_mass: true
    randomize_mass_lower: 0.01
    randomize_mass_upper: 0.25
    force_scale: 2.0
    random_force_prob_scalar: 0.25
    force_decay: 0.9
    force_decay_interval: 0.08
    # Preserve the existing HORA/Sharpa observation perturbation strengths.
    joint_noise_scale: 0.0
    contact_latency: 0.005
    contact_sensor_noise: 0.01

play_profile:
  enabled: true
  env:
    render_spacing: 2.0

interactive:
  show_object_rotation: true
  rotation_body_name: leap_object
